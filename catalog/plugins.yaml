- name: session-report
  harness: claude-code
  marketplace: anthropics/claude-plugins-official
  marketplace_name: claude-plugins-official
  plugin: session-report
  category: context-engineering
  description: "Explorable HTML report of Claude Code usage from local transcripts: tokens, cache hit rate, subagents, skills and the most expensive prompts."
  why: "Official Anthropic; gives the cost tracking your principles ask for across all projects. Read-only local analyzer (no network), audit clean. Needs node on PATH."
  source: https://github.com/anthropics/claude-plugins-official/tree/main/plugins/session-report
