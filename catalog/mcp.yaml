mcp:
- name: rea
  category: reverse-engineering
  description: "Reverse Engineer Anything - lets the agent analyze native binaries, Electron/JS apps and .NET assemblies via Hopper, Ghidra or IDA."
  why: "Requested by the user; the reference reverse-engineering MCP."
  source: https://github.com/morluto/rea
  transport: stdio
  command: npx
  args: [-y, rea-agents@6.9.0, mcp]
- name: gitnexus
  category: agentic-app-dev
  description: "Code knowledge graph across many repos (tree-sitter); query structure, call chains and blast radius. Index a repo with `npx gitnexus analyze`."
  why: "Requested by the user - scan code across multiple monorepos as one knowledge graph. License is PolyForm Noncommercial (fine for personal use; not for commercial work)."
  source: https://github.com/abhigyanpatwari/GitNexus
  transport: stdio
  command: npx
  args: [-y, gitnexus@1.6.12, mcp]
- name: context7
  category: "agentic-app-dev"
  description: "Up-to-date, version-specific library docs and code examples pulled into the agent's context."
  why: "The most-used live-docs MCP (65k stars); directly serves the Code Accuracy Protocol (verify APIs before writing code)."
  source: https://github.com/upstash/context7
  transport: http
  url: https://mcp.context7.com/mcp
  headers: {Authorization: "Bearer ${CONTEXT7_API_KEY}"}
- name: playwright
  category: agentic-app-dev
  description: "Browser automation over the accessibility tree: navigate, click, fill forms, screenshot and run end-to-end checks."
  why: "Official Microsoft, in the MCP registry (40k stars); gives every harness a live browser for testing, not only Claude Code."
  source: https://github.com/microsoft/playwright-mcp
  transport: stdio
  command: npx
  args: [-y, "@playwright/mcp@0.0.85"]
- name: chrome-devtools
  category: agentic-app-dev
  description: "Chrome DevTools for agents: performance traces, network and console inspection, and page automation in a real Chrome."
  why: "Official Chrome DevTools team (58k stars, Apache-2.0); adds performance and network debugging that Playwright MCP lacks. Google usage statistics and CrUX lookups are on by default, so both are turned off here; --isolated uses a throwaway profile."
  source: https://github.com/ChromeDevTools/chrome-devtools-mcp
  transport: stdio
  command: npx
  args: [-y, chrome-devtools-mcp@1.13.0, --no-usage-statistics, --no-performance-crux, --isolated]
